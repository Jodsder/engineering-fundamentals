replicaCount: 2

image:
  repository: dockerlimes/ipt-lr-eng
  # Swap this for your own ACR image from Part B, e.g.
  #   repository: <registry>.azurecr.io/ipt-lr-eng
  tag: v1.0
  pullPolicy: IfNotPresent

service:
  # LoadBalancer makes the in-cluster Azure cloud-provider controller add a
  # frontend IP and rules to the cluster's existing Standard load balancer
  # (`kubernetes`, in the MC_ node resource group) and allocate a public IP.
  # Set back to ClusterIP to take the app off the internet - it is then only
  # reachable via `kubectl port-forward`.
  type: LoadBalancer
  port: 80

# Port the container listens on (see the Dockerfile: `serve -l 3000`).
containerPort: 3000

# The `user` namespace carries an ARM-managed ResourceQuota (limits.cpu 2,
# limits.memory 4Gi, requests.cpu 2, requests.memory 4Gi). A quota that caps
# limits.* makes both limits mandatory - a container missing either one is
# rejected at admission. Keep these small: 2 replicas use 400m/256Mi of the cap.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

# The image already runs as the non-root `nodeapp` user, this just hardens it
# further. runAsNonRoot is intentionally not set: the image declares its user by
# name rather than by UID, which the kubelet cannot verify.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
